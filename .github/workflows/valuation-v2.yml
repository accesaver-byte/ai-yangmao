name: V2 估值真实 Agent 验收
on:
  workflow_dispatch:
    inputs:
      only_cases:
        description: '只验这些案例id（逗号分隔；留空全部），不写业务数据'
        type: string
        default: ''
concurrency:
  group: valuation-v2-evaluate
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  evaluate:
    if: github.repository == 'accesaver-byte/ai-yangmao' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/eval-valuation-v2.ts
        env:
          API_BASE: ${{ secrets.API_BASE }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VALUATION_CASES: ${{ inputs.only_cases }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: valuation-v2-workflow-results
          path: valuation-v2-workflow-results.json
