name: Phase 1 isolated verification
on:
  push:
    branches: ['fix/dedupe-review-stability-20261010']
    paths: ['.review-bootstrap.py', '.github/workflows/review-phase1.yml']
permissions:
  contents: write
concurrency:
  group: phase1-dedupe-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'accesaver-byte/ai-yangmao' && github.ref == 'refs/heads/fix/dedupe-review-stability-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Baseline project checks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/phase1"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/phase1/baseline-typecheck.txt"
          npm test 2>&1 | tee "$RUNNER_TEMP/phase1/baseline-test.txt"
      - name: Add regression tests and demonstrate failures
        shell: bash
        run: |
          python3 .review-bootstrap.py tests
          set +e
          npx vitest run tests/pipeline-workflow.test.ts tests/verification.test.ts --testNamePattern='phase1' --reporter=json --outputFile="$RUNNER_TEMP/phase1/red.json" > "$RUNNER_TEMP/phase1/red.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/phase1/red.txt"
          test "$code" -eq 1
          python3 - "$RUNNER_TEMP/phase1/red.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1]))
          failures=[a for s in report['testResults'] for a in s['assertionResults'] if a['status']=='failed']
          print('Observed failing regressions:', len(failures))
          for a in failures: print(a['fullName'], '\n', '\n'.join(a.get('failureMessages', [])))
          assert len(failures) >= 6, 'Expected duplicate/cadence/transaction regressions were not demonstrated'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pipeline-workflow.test.ts tests/verification.test.ts
          git commit -m 'test: reproduce duplicate intake, cadence and rejection races'
      - name: Apply focused fixes
        run: python3 .review-bootstrap.py fix
      - name: Verify repaired project
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/phase1/green-typecheck.txt"
          npm test 2>&1 | tee "$RUNNER_TEMP/phase1/green-test.txt"
          npx vitest run tests/pipeline-workflow.test.ts tests/verification.test.ts --testNamePattern='phase1' --reporter=json --outputFile="$RUNNER_TEMP/phase1/green.json" > "$RUNNER_TEMP/phase1/green-focused.txt" 2>&1
          git diff --check
      - name: Commit only to the approved repair branch
        shell: bash
        run: |
          branch='fix/dedupe-review-stability-20261010'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add pipeline/run.ts src/worker/index.ts src/worker/admin.ts src/shared/review-stability.ts src/db/schema.ts migrations/0016_rejection_decision_key.sql
          git commit -m 'fix: resolve duplicate intake and preserve review decisions atomically'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$RUNNER_TEMP/phase1/verified-code-sha.txt"
          git archive HEAD -o "$RUNNER_TEMP/phase1/source.tar"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-dedupe-verification
          path: ${{ runner.temp }}/phase1/
          retention-days: 7
          if-no-files-found: warn
