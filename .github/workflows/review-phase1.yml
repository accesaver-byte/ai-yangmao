name: Phase 1 isolated red-green validation
on:
  push:
    branches: ['fix/dedupe-review-stability-20261010']
    paths: ['.review-bootstrap.py', '.github/workflows/review-phase1.yml']
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: isolated-phase1-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'accesaver-byte/ai-yangmao' && (github.ref == 'refs/heads/fix/dedupe-review-stability-20261010' || github.head_ref == 'fix/dedupe-review-stability-20261010')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedupe-review-stability-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Baseline
        run: |
          mkdir -p /tmp/phase1-evidence
          npm run typecheck > /tmp/phase1-evidence/baseline-typecheck.log 2>&1
          npm test > /tmp/phase1-evidence/baseline-tests.log 2>&1
      - name: Failing regressions before production changes
        run: |
          if [ ! -f .review-bootstrap.py ]; then echo 'Already applied; do not run twice'; exit 1; fi
          python3 .review-bootstrap.py tests
          set +e
          npx vitest run tests/pipeline-workflow.test.ts tests/verification.test.ts > /tmp/phase1-evidence/red-tests.log 2>&1
          rc=$?
          set -e
          tail -60 /tmp/phase1-evidence/red-tests.log
          test "$rc" -ne 0
      - name: Apply minimal fixes and validate
        run: |
          python3 .review-bootstrap.py fix
          npm run typecheck > /tmp/phase1-evidence/typecheck.log 2>&1
          npm test > /tmp/phase1-evidence/green-tests.log 2>&1
          npm run build:web > /tmp/phase1-evidence/build-web.log 2>&1
          git diff --check
          npm audit --json > /tmp/phase1-evidence/npm-audit.json || true
          tail -35 /tmp/phase1-evidence/green-tests.log
      - name: Commit only validated branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline/run.ts src/worker/index.ts src/worker/admin.ts src/shared/review-stability.ts src/db/schema.ts migrations/0016_rejection_decision_key.sql tests/pipeline-workflow.test.ts tests/verification.test.ts
          git diff --cached > /tmp/phase1-evidence/fix.patch
          git commit -m 'fix: close duplicate intake and atomically remember rejected updates'
          git rev-parse HEAD > /tmp/phase1-evidence/verified-commit.txt
          tar -czf /tmp/phase1-evidence/source-files.tgz pipeline/run.ts src/worker/index.ts src/worker/admin.ts src/shared/review-stability.ts src/db/schema.ts migrations/0016_rejection_decision_key.sql tests/pipeline-workflow.test.ts tests/verification.test.ts
          git rm .review-bootstrap.py
          git commit -m 'chore: remove completed branch-only patch runner'
          git push origin HEAD:refs/heads/fix/dedupe-review-stability-20261010
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-red-green-validation
          path: /tmp/phase1-evidence/
          retention-days: 30
