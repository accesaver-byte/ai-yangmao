name: 抽取经验回归
on:
  workflow_dispatch:
    inputs:
      only_cases:
        description: '只验这些案例id（逗号分隔；留空验全部）'
        type: string
        default: ''
concurrency:
  group: extraction-lessons
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  evaluate:
    if: github.repository == 'accesaver-byte/ai-yangmao' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/eval-extraction-lessons.ts
        env:
          API_BASE: ${{ secrets.API_BASE }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LESSON_CASES: ${{ inputs.only_cases }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-lessons-results
          path: extraction-lessons-results.json
