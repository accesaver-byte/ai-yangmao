name: One-time encrypted Actions credential migration
on:
  push:
    branches: [codex/collaboration-protection]
    paths: [.github/workflows/migrate-actions-secrets.yml]
permissions:
  contents: read
jobs:
  seal:
    if: github.actor == 'accesaver-byte' && github.repository == 'accesaver-byte/ai-yangmao'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sealed-box implementation
        run: python3 -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Encrypt existing secrets for the production environment
        env:
          API_BASE: ${{ secrets.API_BASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, pathlib
          from nacl.public import PublicKey, SealedBox
          key = {'key_id': '3380204578043523366', 'key': 'KqM2rKpyNJysPBf7fxhTJ+iW14fsi1kGW87TvPu/0xw='}
          names = ['API_BASE', 'DEEPSEEK_API_KEY', 'DISCORD_BOT_TOKEN', 'EXA_API_KEY', 'GEMINI_API_KEY', 'GLM_API_KEY', 'INGEST_TOKEN', 'OPENROUTER_API_KEY']
          box = SealedBox(PublicKey(base64.b64decode(key['key'])))
          output = pathlib.Path('sealed-secrets')
          output.mkdir(mode=0o700)
          for name in names:
              value = os.environ[name]
              if not value:
                  raise RuntimeError('Missing credential: ' + name)
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              (output / (name + '.json')).write_text(json.dumps({
                  'encrypted_value': encrypted, 'key_id': key['key_id']
              }))
          print('Encrypted credential count:', len(names))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-production-secrets
          path: sealed-secrets/*.json
          retention-days: 1
          if-no-files-found: error
