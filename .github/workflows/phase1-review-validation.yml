name: Phase 1 isolated validation
on:
  push:
    branches: ['fix/dedupe-review-stability-20261010']
    paths: ['.review-bootstrap.py', '.github/workflows/phase1-review-validation.yml']
permissions:
  contents: write
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p /tmp/phase1-validation && npm ci
      - name: Verify failing regressions before product changes
        shell: bash
        run: |
          python3 .review-bootstrap.py tests
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/verification.test.ts')
          old='return { status: response.status, body: await response.json() as Record<string, unknown> };'
          new="return { status: response.status, body: (response.headers.get('Content-Type')?.includes('application/json') ? await response.json() : { error: await response.text() }) as Record<string, unknown> };"
          assert p.read_text().count(old)==1
          p.write_text(p.read_text().replace(old,new))
          PY
          set +e
          npx vitest run tests/pipeline-workflow.test.ts tests/verification.test.ts > /tmp/phase1-validation/red-tests.log 2>&1
          code=$?
          set -e
          tail -160 /tmp/phase1-validation/red-tests.log
          test "$code" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=re.sub(r'\x1b\[[0-9;]*m','',Path('/tmp/phase1-validation/red-tests.log').read_text())
          assert '6 failed' in log and 'AssertionError' in log and 'SyntaxError' not in log, log[-6000:]
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pipeline-workflow.test.ts tests/verification.test.ts
          git commit -m 'test: cover resolved duplicates, cadence changes and atomic rejection'
      - name: Apply targeted fixes and verify full project
        shell: bash
        run: |
          python3 .review-bootstrap.py fix
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/phase1-validation/typecheck.log
          npm test 2>&1 | tee /tmp/phase1-validation/green-tests.log
          npm run build:web 2>&1 | tee /tmp/phase1-validation/build-web.log
          git diff --check
          git diff --stat
      - name: Preserve validation evidence and publish only the repair branch
        shell: bash
        run: |
          git add pipeline/run.ts src/worker/index.ts src/worker/admin.ts src/shared/review-stability.ts src/db/schema.ts migrations/0016_rejection_decision_key.sql
          git diff --cached > /tmp/phase1-validation/fix.patch
          tar -czf /tmp/phase1-validation/source-files.tgz pipeline/run.ts src/worker/index.ts src/worker/admin.ts src/shared/review-stability.ts src/db/schema.ts migrations/0016_rejection_decision_key.sql tests/pipeline-workflow.test.ts tests/verification.test.ts
          git commit -m 'fix: close duplicate intake and preserve grounded changes and rejection memory'
          git rev-parse HEAD | tee /tmp/phase1-validation/verified-commit.txt
          git push origin HEAD:refs/heads/fix/dedupe-review-stability-20261010
      - name: Record dependency audit without changing dependencies
        if: always()
        run: npm audit --json > /tmp/phase1-validation/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-red-green-validation
          path: /tmp/phase1-validation/
          retention-days: 14
