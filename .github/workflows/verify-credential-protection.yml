name: Actions 凭据保护验收
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Deliberately rely on the environment policy so a non-main probe is denied.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Check environment credential availability without using or printing values
        env:
          API_BASE: ${{ secrets.API_BASE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          names = ['API_BASE', 'DEEPSEEK_API_KEY', 'DISCORD_BOT_TOKEN', 'EXA_API_KEY', 'GEMINI_API_KEY', 'GLM_API_KEY', 'INGEST_TOKEN', 'OPENROUTER_API_KEY']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise RuntimeError('Missing environment credentials: ' + ', '.join(missing))
          print('All 8 protected environment credentials are available; no API calls were made.')
          PYTHON
