name: 采集

on:
  # 定时由 Cloudflare Worker 负责（wrangler.jsonc 的 17 */6 * * *，调用 workflow_dispatch）；GitHub 自带定时从未触发，已移除
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练：不写业务数据，模型调用仍记预算'
        type: boolean
        default: false
      only_sources:
        description: '只跑这些信源（逗号分隔的 id，留空为全部）'
        type: string
        default: ''
      force:
        description: '忽略上次比对结果，强制重新抽取（提示词改进后补跑）'
        type: boolean
        default: false
      fast_leads:
        description: '快速通道：只采集重要线索并研判，跳过全站复核'
        type: boolean
        default: false
      official_review_limit:
        description: '本轮官方复核条数（留空用仓库配置，0跳过）'
        type: string
        default: ''
      lead_review_limit:
        description: '受阻线索官方复核条数（默认4，0跳过）'
        type: string
        default: '4'
      lead_review_ids:
        description: '诊断时仅复核这些受阻线索ID（逗号分隔，留空全部）'
        type: string
        default: ''
      lead_limit:
        description: '本轮最多研判多少条线索'
        type: string
        default: '50'
      screening_ids:
        description: '只筛选这些 screening item id（逗号分隔，留空为队列）'
        type: string
        default: ''
      probe_urls:
        description: '诊断：只用生产读取逻辑抓取这些网址并打印结果（逗号分隔），不运行采集'
        type: string
        default: ''

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 读取诊断
        if: ${{ inputs.probe_urls != '' && inputs.probe_urls != null }}
        run: npx tsx scripts/probe-fetch.ts
        env:
          PROBE_URLS: ${{ inputs.probe_urls }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      - name: 运行采集管线
        if: ${{ inputs.probe_urls == '' || inputs.probe_urls == null }}
        run: npm run collect
        env:
          API_BASE: ${{ secrets.API_BASE }}
          IDENTITY_MODE: ${{ vars.IDENTITY_MODE || 'off' }}
          IDENTITY_MODEL_ASSIST: ${{ vars.IDENTITY_MODEL_ASSIST || 'false' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-4-flash' }}
          USE_GLM: ${{ vars.USE_GLM || '0' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_PRICE_IN: ${{ vars.DEEPSEEK_PRICE_IN || '3' }}
          DEEPSEEK_PRICE_OUT: ${{ vars.DEEPSEEK_PRICE_OUT || '10' }}
          MONTHLY_COST_CAP_CNY: ${{ vars.MONTHLY_COST_CAP_CNY || '72' }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DAILY_TOKEN_CAP: ${{ vars.DAILY_TOKEN_CAP || '0' }}
          SCREENING_MODE: ${{ vars.SCREENING_MODE || 'off' }}
          SCREENING_MODELS: ${{ vars.SCREENING_MODELS }}
          SCREENING_PAID_MODEL: ${{ vars.SCREENING_PAID_MODEL }}
          SCREENING_PAID_PRICE_IN: ${{ vars.SCREENING_PAID_PRICE_IN }}
          SCREENING_PAID_PRICE_OUT: ${{ vars.SCREENING_PAID_PRICE_OUT }}
          SCREENING_IDS: ${{ inputs.screening_ids }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_SOURCES: ${{ inputs.only_sources }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LEAD_LIMIT: ${{ inputs.lead_limit || '50' }}
          FAST_LEADS: ${{ inputs.fast_leads && '1' || '0' }}
          LEAD_REVIEW_LIMIT: ${{ inputs.lead_review_limit || vars.LEAD_REVIEW_LIMIT || '4' }}
          LEAD_REVIEW_IDS: ${{ inputs.lead_review_ids }}
          OFFICIAL_REVIEW_LIMIT: ${{ inputs.official_review_limit || vars.OFFICIAL_REVIEW_LIMIT || '8' }}
