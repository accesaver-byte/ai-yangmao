.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.bad{border-color:color-mix(in oklab,var(--critical) 55%,transparent);color:var(--critical-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.review-actions .btn{max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.5;text-align:center;flex-shrink:0}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
select,textarea,input:not([type]),input[type="date"],input[type="url"],input[type="text"],input[type="search"],input[type="number"],input[type="password"],input[type="email"]{width:100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--ink)}
textarea{line-height:1.6;resize:vertical}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tog span small{display:block;color:var(--muted);font-size:12px}
.tog input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked{background:var(--s3)}
.tog input:checked::after{transform:translateX(18px)}

/* ---------- today: hero meadow ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 62%)}
.hero-over{position:absolute;left:18px;top:14px;right:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hero-over>*{pointer-events:auto}
.total{display:flex;flex-direction:column;gap:2px}
.total .l{font-size:13px;color:var(--ink-2)}
.total .v{font-family:var(--f-num);font-weight:700;font-size:clamp(36px,6vw,52px);line-height:1;color:var(--ink);letter-spacing:-.01em}
.total .d{font-size:12.5px;color:var(--ink-2)}
.wx{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:16px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line)}
.wx svg{width:40px;height:40px;flex:none}
.wx .i{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1}
.wx .t{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.meadow{display:block;width:100%;height:auto;touch-action:manipulation}
.meadow .sheep{cursor:pointer}
.meadow .sheep:focus{outline:none}
.meadow .sheep:focus-visible .wool-o{stroke:var(--s1);stroke-width:4}
.meadow .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.meadow .sheep:hover .bob{animation-duration:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.6px) rotate(-1.2deg)}}
.meadow .snip{animation:snip 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 70%}
@keyframes snip{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.flock-legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
.flock-value-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:10px 16px;background:var(--tag-soft);color:var(--ink);border-top:1px solid var(--line);font-size:13px}
.flock-value-note a{padding:3px 0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.flock-value-note a:hover{color:var(--warn-ink)}
@media (max-width:640px){ .hero-over{position:static;padding:14px 14px 0} }

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kpi{padding:12px 14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k-l{font-size:12.5px;color:var(--ink-2)}
.kpi .k-v{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.15}
.kpi .k-v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi svg{width:100%;height:30px;color:var(--s1);margin-top:2px}

.clocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:10px}
.clock{position:relative;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.clock:hover{border-color:var(--line-2)}
.clock svg{width:54px;height:54px;flex:none}
.clock .cd{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.clock .ttl{font-size:13px;line-height:1.35;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- offer cards ---------- */
.ocards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.ocard{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:8px 12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s}
.ocard:hover{border-color:var(--ink-2)}
.ocard .stretch{position:absolute;inset:0;border-radius:16px;z-index:1}
.oc-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc-title{font-weight:600;font-size:15.5px;line-height:1.38;margin:0}
.oc-plat{font-size:12.5px;color:var(--muted)}
.oc-val{font-family:var(--f-num);font-size:21px;font-weight:600;line-height:1.2}
.oc-val small{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body);margin-left:4px}
.oc-radar{width:66px;height:66px;align-self:center}
.oc-foot{grid-column:1/-1;display:flex;flex-direction:column;gap:7px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
/* Unknown deadline: an empty dashed track, so nothing reads as time remaining. */
.bar.unknown{height:2px;margin-block:2px;border-radius:0;background:repeating-linear-gradient(90deg,var(--line-2) 0 4px,transparent 4px 9px)}
.more-cards{display:flex;margin:14px auto 0}
.oc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.cmp{position:relative;z-index:2;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:11.5px;padding:2px 8px;cursor:pointer;color:var(--ink-2)}
.cmp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Touch screens: small controls keep their look but get a finger-sized target. */
@media (pointer:coarse){.cmp{min-height:32px;padding:6px 12px}a.chip{min-height:32px;padding-block:7px}}
.rows{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.orow:hover{background:var(--surface-2)}
.orow .when{font-family:var(--f-num);font-size:13px;color:var(--ink-2);min-width:62px}
.orow .t{font-weight:500;line-height:1.35}
.orow .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

/* ---------- calendar ---------- */
.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.month h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 2px}
.ramp{display:inline-flex;gap:2px;vertical-align:middle}
.ramp i{width:16px;height:10px;border-radius:3px;display:block}
.hols{display:flex;flex-wrap:wrap;gap:8px}
.hol{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;max-width:100%}
.hol b{font-size:13.5px}

/* ---------- detail ---------- */
.dt-top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.dt-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,38px);line-height:1.18;margin:8px 0 4px;text-wrap:balance}
.dt-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){ .dt-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)} }
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.fact{padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.fact .l{font-size:12px;color:var(--muted)}
.fact .v{font-weight:600;line-height:1.4}
.fact .v small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.bigval{font-family:var(--f-num);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1.05}
/* Without an amount, the benefit itself is the headline. */
.dt-benefit{font-weight:700;font-size:clamp(19px,2.4vw,23px);line-height:1.45;margin:2px 0 4px;max-width:36em;text-wrap:pretty}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.quote{position:relative;padding:12px 14px 12px 40px;background:var(--surface-2);border-radius:12px;font-size:14px;color:var(--ink-2);margin:0}
.quote::before{content:"“";position:absolute;left:12px;top:0;font-family:var(--f-display);font-size:42px;color:var(--tag);line-height:1.1}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:3px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.tl li.hot::before{background:var(--tag)}
.tl li::after{content:"";position:absolute;left:7px;top:19px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl time{font-family:var(--f-num);font-size:12px;color:var(--muted);display:block}
.diff{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.diff del{color:var(--critical-ink)}
.diff ins{color:var(--good-ink);text-decoration:none;font-weight:600}
.ring-big{display:flex;align-items:center;gap:14px}
.ring-big svg{width:92px;height:92px;flex:none}
.ring-big .cd{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- misc blocks ---------- */
.graves{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr));gap:16px 12px;align-items:end;padding-bottom:6px;border-bottom:6px solid var(--hill-2)}
.grave{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:20px 10px 12px;border-radius:72px 72px 8px 8px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink-2);font-size:12.5px;min-width:0}
.grave:hover{border-color:var(--ink-2)}
.grave .rip{font-family:var(--f-display);font-size:14px;color:var(--muted);letter-spacing:.18em}
.grave b{color:var(--ink);font-size:13.5px;line-height:1.35}
.grave .age{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.03em}
td.n{font-variant-numeric:tabular-nums;font-family:var(--f-num)}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--surface-2)}
.ecg{width:160px;height:26px;display:block}
.qitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.qitem .t{font-weight:600}
.qitem .m{font-size:12.5px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1);border-radius:99px}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.pips i.on{background:var(--good)}
.prog{display:flex;align-items:center;gap:16px}
.prog svg{width:132px;height:132px;flex:none}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-family:var(--f-num);font-size:24px}

/* ---------- overlays ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,10,.42)}
.sheet-panel{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet-panel h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
@media (min-width:720px){ .sheet{align-items:center} .sheet-panel{border-radius:22px} }
.more-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.more-nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);font-size:14.5px}
.more-nav svg{width:20px;height:20px}
#tip{position:fixed;z-index:80;pointer-events:none;max-width:260px;padding:9px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;color:var(--ink)}
#tip b{display:block;font-size:13.5px}
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 32px)}
.tray .btn{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
@media (min-width:960px){ .tray{bottom:22px} }
#toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* 条款对比：在窄审核卡中也保留完整旧值、新值与明确的增删改标记。 */
.review-diff{border:1px solid var(--line-2);border-left:3px solid var(--warn-ink);border-radius:10px;padding:10px;background:var(--surface-2);font-size:13px;container-type:inline-size}
.review-diff>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;list-style-position:inside}
.review-diff-counts{display:flex;gap:5px;flex-wrap:wrap}
.diff-badge{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.diff-add{color:var(--good-ink)}.diff-remove{color:var(--critical-ink)}.diff-modify{color:var(--warn-ink)}
.review-diff-field{margin:0;padding:10px 0;border-top:1px solid var(--line)}
.review-diff-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.review-diff-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.review-diff-pair>div{min-width:0}.review-diff-pair>div+div{border-left:1px solid var(--line);padding-left:12px}
.review-diff-value{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.review-diff-value ol{padding-left:20px;margin:0;white-space:normal}.review-diff-value li{margin:3px 0}
.review-diff del{color:var(--critical-ink);background:color-mix(in srgb,var(--critical-ink) 14%,transparent);text-decoration-thickness:1.5px}
.review-diff ins{color:var(--good-ink);background:color-mix(in srgb,var(--good-ink) 15%,transparent);text-decoration:none;font-weight:600}
@container (max-width:400px){.review-diff-pair{grid-template-columns:minmax(0,1fr)}.review-diff-pair>div+div{border-left:0;border-top:1px dashed var(--line);padding:6px 0 0}}
/* Selection controls must remain usable in narrow review cards and mobile sheets. */
[data-membership-editor] fieldset,[data-owned-subscriptions] fieldset{min-inline-size:0;border:1px solid var(--line-2);border-radius:10px;padding:10px}
[data-membership-editor] .chip{white-space:normal;overflow-wrap:anywhere}
[data-membership-editor] details,[data-owned-subscriptions] details{margin:8px 0}
[data-membership-editor] summary,[data-owned-subscriptions] summary{cursor:pointer;margin-bottom:6px}

/* Admin workspaces: stage colour identifies the queue, semantic red remains for destructive actions. */
.review-tone-fast{--review-accent:#8a5a00;--review-soft:#fbeec4}
.review-tone-activities{--review-accent:#2568b8;--review-soft:#e5eefb}
.review-tone-leads{--review-accent:#7453ad;--review-soft:#eee7f8}
.review-tone-live{--review-accent:#377a29;--review-soft:#e8f3de}
.admin-tabs{display:flex;flex-wrap:wrap;max-width:100%;border-radius:18px}
.review-workspaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 26px}
.review-workspaces button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:17px 14px;border:1px solid var(--line);border-top:4px solid var(--review-accent);border-radius:14px;background:var(--surface);color:var(--review-accent);font:600 15px/1.5 var(--f-body);cursor:pointer}
.review-workspaces button[aria-selected=true]{background:var(--review-soft);border-color:var(--review-accent);box-shadow:0 0 0 1px var(--review-accent)}
.review-workspaces button span{font-family:var(--f-num);flex-shrink:0}
.review-workspace-title{font:600 22px/1.4 var(--f-body);border-left:5px solid var(--review-accent);padding-left:14px;margin:0 0 20px}
.review-workspace :is(.g2,[data-ft-jobs],[data-lead-section],[data-identity-slot]){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.review-workspace :is([data-ft-jobs],[data-lead-section],[data-identity-slot])>:not(.review-tile){grid-column:1/-1}
.review-workspace [data-lead-section]:not([open]){display:block}
.review-workspace [data-lead-section]>details{display:grid;grid-template-columns:subgrid}
.review-workspace [data-lead-section]>details:not([open]){display:block}
.review-workspace [data-lead-section]>details>summary{grid-column:1/-1}
.review-group-label,.review-workspace [data-activity-section]>details>summary,.review-workspace [data-live-section] summary,.review-workspace [data-lead-section]>summary{font-size:14px;font-weight:600;color:var(--ink-2);margin:16px 0 12px}
.review-tile{border-top:4px solid var(--review-accent);display:flex!important;flex-direction:column;gap:14px!important;margin:0!important;padding:18px;min-height:350px;height:100%}
.review-tile[style*="display: none"],.review-tile[style*="display:none"]{display:none!important}
.review-tile-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-2)}
.review-state{border-radius:6px;padding:2px 7px;background:var(--review-soft);color:var(--review-accent);flex-shrink:0;max-width:65%}
.review-tile-title{font:600 17px/1.5 var(--f-body);margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.review-tile-value{font:600 20px/1.5 var(--f-body);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.review-tile-facts{margin:0;font-size:13px}
.review-tile-facts>div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.review-tile-facts dt{color:var(--muted)}.review-tile-facts dd{margin:0;text-align:right;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.review-tile-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.review-tile-actions .btn{font-size:13px;padding:8px 12px}.review-primary{flex:1;background:var(--review-accent);color:white;border-color:var(--review-accent)}
.review-fast-layout>section{margin-bottom:24px}
.review-fast-layout [data-ft-jobs],.review-completed-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
